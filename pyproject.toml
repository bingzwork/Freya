[project]
name = "freya-ai"
version = "0.3.0"
description = "A local, workspace-aware software engineering agent."
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=tmp/pytest_tmp --cache-clear -p no:cacheprovider --disable-warnings"
